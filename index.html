<div class="shell">
<header class="nav"><div class="brand"><span class="brand-mark">✳</span>AI 机会诊断</div><div class="nav-right"><a href="workbench/" style="color:inherit;text-decoration:none">项目工作台 ↗</a>　·　轻松选场景</div></header>
<section class="hero"><div><div class="eyebrow">从真实工作开始</div><h1>AI 能帮上哪些忙？</h1><p>看一个工作场景，判断它值不值得先试。右滑保留，左滑跳过；也可以直接点按钮。</p></div><span class="hero-note">完整清单 · 85 个场景</span></section>
<section class="company-profile"><div><span class="eyebrow">先说清楚是哪家企业</span><b>这份诊断属于哪个企业？</b><small>只记录你提供的信息；未填写的部分不会被当作事实。</small></div><input id="companyName" placeholder="企业名称"><input id="industry" placeholder="行业 / 主营业务"><input id="headcount" type="number" min="1" placeholder="员工人数"><input id="respondent" placeholder="填写人 / 业务负责人"></section>
<div class="summary"><div class="counter"><strong id="n-keep">0</strong><span>可设计试点</span></div><div class="counter"><strong id="n-review">0</strong><span>先访谈</span></div><div class="counter"><strong id="n-skip">0</strong><span>暂不考虑</span></div><div class="counter"><strong id="n-left">85</strong><span>还没看</span></div></div>
<div class="work">
<aside class="side"><h2>先看哪个工作</h2><div class="departments" id="departments"></div></aside>
<main class="stage"><div class="stage-top"><div class="progress" id="progress"></div><input class="search" id="search" placeholder="搜一个场景"></div><article class="panel card" id="card"></article><div class="actions"><button class="action skip" id="skip">← 跳过</button><button class="action keep" id="keep">可设计试点 →</button><button class="action review" id="review">先访谈</button></div><div class="keyboard">桌面上可按 ← / → · 手机左右滑动卡片</div><div class="toolbar"><button class="smallbtn" id="undo">撤销上一步</button><button class="smallbtn" id="clear">重新开始</button></div><textarea id="note" class="note" placeholder="可选：写下你公司的实际情况"></textarea></main>
</div>
<section class="panel report" id="report">
<div class="report-head"><div><div class="eyebrow">你的诊断摘要</div><h2>把机会变成行动</h2><p>只报告已填写的企业信息；未知项保持未知，收益需由试点数据验证。</p></div><div class="report-actions"><button class="smallbtn" id="csv">导出表格 CSV</button><button class="smallbtn" onclick="window.print()">打印 / 保存 PDF</button></div></div>
<div id="report-body"></div>
</section>
<footer class="footer">选择结果保存在本机浏览器。外部案例仅作参考，实际收益需用企业自己的数据验证。</footer>
</div><div class="toast" id="toast"></div>

function refineTask(t){

 const role={'经营管理':'业务负责人核对指标口径和来源，并决定是否采取经营动作。','市场营销':'市场负责人核对受众、品牌口径、素材权利和投放预算。','销售':'销售负责人核实客户事实和承诺；价格、合同由授权人批准。','客服':'客服人员核实客户上下文和政策，再决定是否发送或升级。','产品研发':'产品/工程负责人验证需求、代码与测试结果后再进入版本。','采购':'采购负责人复核供应商事实、比价口径及审批权限。','供应链':'计划/仓储负责人核实库存与供应约束后调整采购或排程。','生产/交付':'现场主管或质量工程师确认现场条件、安全与最终放行。','财务':'财务人员核对原始凭证、会计口径和审批；AI 不付款、不记最终账。','人力资源':'招聘/HR 负责人用统一标准复核；AI 不独立淘汰或录用候选人。','法务/合规':'法务/合规人员核对原文、适用地区和生效版本并作最终判断。','IT/数据':'系统/数据负责人核对权限、环境、日志与回滚后才变更生产配置。','行政/办公':'经办人与审批人检查原件、政策和收件人后再提交或发送。','电商/零售':'运营负责人核实商品事实、库存、价格和平台规则后发布。','客户成功/项目交付':'项目经理与客户负责人核对范围、里程碑和验收口径。','跨部门':'流程所有者确认数据来源、字段映射和跨系统写入权限。'}[d]||'业务负责人核实资料和例外情形后作最终决定。';
 const action={extract:`把“${n}”涉及的文本或记录拆成指定字段，标出原文位置、缺项、冲突和待人工确认项，再输出可复核的表格/草稿。`,knowledge:`只从企业批准的制度、产品资料或流程文档中检索“${n}”所需答案，同时给出引用段落、文件版本和找不到依据时的转人工提示。`,draft:`根据已确认的事实与模板，先起草“${n}”所需内容；把缺少的事实标成待补，不自行编造，并提供可编辑版本供负责人逐项审阅。`,predict:`用历史记录和当前约束，为“${n}”生成趋势/优先级或方案比较；同时展示关键输入、假设、不确定范围和触发人工复核的阈值。`,detect:`按企业确认的规则扫描“${n}”中的异常候选，列出触发规则、证据位置、影响对象和置信提示，供负责人逐条核查。`,summarize:`把“${n}”相关记录归并成事项、证据、变化、责任人和待决问题清单；保留原始出处，避免只给结论不留依据。`,process:`先把“${n}”当前步骤、输入和交接点整理清楚，再辅助完成重复录入、提醒或路由草稿；遇到例外时暂停并交给责任人。`};
 const pain={extract:'可能耗在逐份找字段、复制粘贴、补缺项和反复核对；先用样本确认人工实际耗时与错误类型。',knowledge:'可能耗在翻多个版本、问同一类问题和无法确认答案出处；先核实员工最常问的具体问题。',draft:'可能耗在从空白起稿、套格式和多轮修改；先记录现有起草周期及退改原因。',predict:'可能耗在表格汇总、经验判断和发现问题太晚；先验证历史数据是否足以支持判断。',detect:'可能耗在人工逐条筛查或异常发现滞后；先统计漏检、误报和复核时间。',summarize:'可能耗在跨文档拼信息、会后整理和跟进遗漏；先核对信息分散在哪些系统/表格。',process:'可能耗在重复录入、等待交接和状态追问；先画出现有步骤、例外及责任人。'};

bindCompanyProfile();document.getElementById("keep").onclick=()=>choose("保留");document.getElementById("review").onclick=()=>choose("待访谈");document.getElementById("skip").onclick=()=>choose("跳过");document.getElementById("search").oninput=()=>{cursor=0;render()};document.getElementById("undo").onclick=()=>{const h=history.pop();if(!h){toast("没有可撤销的选择");return}if(h.old)saved[h.id]=h.old;else delete saved[h.id];localStorage.setItem("ai-scan-v2",JSON.stringify(saved));cursor=0;render();toast("已撤销")};document.getElementById("clear").onclick=()=>{if(!confirm("清除本轮选择并重新开始？"))return;Object.keys(saved).forEach(k=>delete saved[k]);history=[];cursor=0;localStorage.removeItem("ai-scan-v2");render()};document.getElementById("csv").onclick=()=>{const chosen=tasks.filter(t=>["保留","待访谈"].includes(status(t.id)));const cols=["企业","行业","员工人数","判断状态","部门","场景","当前流程","每周频次","单次分钟","月返工数","负责人","证据来源","数据准备度","AI可承担","AI边界/人工把关","缺口与建议","验证指标","收益假设"];const rows=chosen.map(t=>{let f=saved[t.id]||{};return [companyProfile.companyName,companyProfile.industry,companyProfile.headcount,status(t.id),t.dept,t.title,f.process,f.frequency,f.minutes,f.rework,f.owner,f.evidence,f.data,t.ai,t.limits,t.first,t.measure,t.benefit]});const q=x=>'"'+String(x??"").replaceAll('"','""')+'"';const csv="\uFEFF"+[cols,...rows].map(r=>r.map(q).join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="企业AI场景诊断-证据版.csv";a.click();URL.revokeObjectURL(a.href)};
document.addEventListener("keydown",e=>{if(e.target.matches("textarea,input"))return;if(e.key==="ArrowRight")choose("保留");if(e.key==="ArrowLeft")choose("跳过")});
const card=document.getElementById("card");let sx=0,sy=0;card.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});card.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.2){card.style.transform="translateX("+(dx>0?"28px":"-28px")+")";card.style.opacity=".7";setTimeout(()=>{card.style.transform="";card.style.opacity="";choose(dx>0?"保留":"跳过")},130)}},{passive:true});render();
</script></body></html>
