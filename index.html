<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业 AI 赋能场景卡片</title><style>body{margin:0;background:#f4f6f2;color:#1c2923;font:15px/1.6 Arial,'Microsoft YaHei',sans-serif}.wrap{max-width:1060px;margin:35px auto;padding:0 22px}h1{font-size:38px;margin:8px 0}.muted{color:#68766e}.layout{display:grid;grid-template-columns:210px 1fr;gap:20px}.box{background:white;border:1px solid #e1e7e1;border-radius:16px;padding:22px}.filters button,.actions button{cursor:pointer;border:1px solid #dce4dc;background:white;border-radius:10px;padding:9px 12px;margin:4px}.filters button.active,.keep{background:#17674d!important;color:white}.filters{display:flex;flex-direction:column}.card h2{font-size:27px}.label{font-size:12px;color:#17674d;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#f5f8f4;border-radius:12px;padding:14px}.tile b{display:block;color:#17674d;font-size:12px}.actions{margin-top:20px;display:flex;justify-content:space-between}.actions button{padding:12px 20px}.note{width:100%;min-height:70px;border:1px solid #dce4dc;border-radius:10px;padding:10px;box-sizing:border-box}@media(max-width:700px){body{font-size:16px}.wrap{margin:0 auto;padding:14px 14px 30px}h1{font-size:29px;line-height:1.2}.layout{grid-template-columns:1fr;gap:12px}.box{padding:16px;border-radius:14px}.filters{flex-direction:row;overflow-x:auto;scrollbar-width:none}.filters button{white-space:nowrap;flex:0 0 auto;padding:10px 13px}.grid{grid-template-columns:1fr;gap:9px}.tile{padding:13px}.actions{position:sticky;bottom:0;z-index:2;gap:6px;background:#f4f6f2;padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin:8px 0}.actions button{flex:1;padding:13px 4px;margin:0;font-size:14px}.note{font-size:16px}}@media(min-width:701px){body{background:#e8ece8}.wrap{width:390px;height:844px;max-width:none;margin:28px auto;padding:18px 16px 96px;overflow:auto;position:relative;background:#f4f6f2;border:10px solid #202722;border-radius:42px;box-shadow:0 22px 70px #14271e40}.wrap h1{font-size:25px;line-height:1.16}.wrap>p.muted{font-size:12px}.layout{display:block}.layout>aside{margin:12px 0;padding:12px}.filters{flex-direction:row;overflow-x:auto;scrollbar-width:none}.filters button{white-space:nowrap;flex:0 0 auto;padding:7px 10px;font-size:12px}.layout main>#count{font-size:11px}.card{height:445px;overflow-y:auto;padding:16px}.card h2{font-size:22px}.grid{grid-template-columns:1fr;gap:7px}.tile{font-size:12px;padding:10px}.actions{position:fixed;width:340px;left:50%;transform:translateX(-50%);bottom:35px;z-index:5;background:white;padding:8px;border-radius:14px;box-shadow:0 4px 18px #12251b25;gap:5px}.actions button{flex:1;padding:10px 3px;margin:0;font-size:11px}.wrap::-webkit-scrollbar,.filters::-webkit-scrollbar,.card::-webkit-scrollbar{display:none}}</style><body><div class="wrap"><div class="muted">企业 AI 机会盘点 / 第一步</div><h1>把工作任务变成可判断的机会</h1><p class="muted">先按部门浏览任务卡片，核对痛点、AI 工作边界、人机分工、收益验证、难度与风险要求。</p><div class="layout"><aside class="box"><b>部门流程</b><div class="filters" id="filters"></div></aside><main><div class="muted" id="count"></div><article class="box card" id="card"></article><div class="actions"><button id="prev">上一个</button><button id="keep" class="keep">保留</button><button id="skip">暂不考虑</button><button id="next">下一个</button></div><div class="box"><b>补充备注</b><textarea class="note" id="note" placeholder="记录企业现状、数据条件或访谈结论"></textarea></div></main></div></div><script>const items=[{"id":"M01","dept":"经营管理","title":"汇总多部门周报并提取进度、阻塞、需决策事项","ai":"检索/生成","guard":"负责人确认数据口径和决策事项"},{"id":"M02","dept":"经营管理","title":"会议纪要、行动项、责任人与截止日期提取","ai":"生成/分类","guard":"参会人确认责任与期限"},{"id":"M03","dept":"经营管理","title":"经营指标异常解释与追问式分析","ai":"检索/生成","guard":"指标定义、权限隔离；管理者决策"},{"id":"M04","dept":"经营管理","title":"制度、流程与经营知识问答","ai":"检索","guard":"文档版本、访问控制、答案引用"},{"id":"M05","dept":"经营管理","title":"目标拆解、OKR 草拟与进展差距摘要","ai":"生成/分析","guard":"负责人确认目标，不自动定绩效"},{"id":"M06","dept":"市场营销","title":"客户/行业/竞品公开信息摘要","ai":"检索/生成","guard":"信息来源标注、时效核查"},{"id":"M07","dept":"市场营销","title":"活动主题、渠道文案与多版本内容草拟","ai":"生成","guard":"品牌/法务审核，事实核验"},{"id":"M08","dept":"市场营销","title":"长内容改写为短视频脚本、社媒帖、邮件等","ai":"生成","guard":"版权、品牌语气、事实核验"},{"id":"M09","dept":"市场营销","title":"用户反馈、评论与调研开放题聚类","ai":"分类/总结","guard":"样本偏差及隐私处理"},{"id":"M10","dept":"市场营销","title":"营销线索去重、补全、分层与优先级建议","ai":"分类/预测","guard":"数据来源合法性；销售确认"},{"id":"M11","dept":"市场营销","title":"广告投放素材版本分析与表现归因摘要","ai":"分析/生成","guard":"归因口径、实验设计"},{"id":"M12","dept":"销售","title":"销售通话纪要、需求、异议与承诺提取","ai":"生成/分类","guard":"客户告知、记录准确性"},{"id":"M13","dept":"销售","title":"客户画像/账户资料汇总和拜访准备","ai":"检索/生成","guard":"信息来源及时、权限合规"},{"id":"M14","dept":"销售","title":"商机阶段、成交概率和下一步建议","ai":"预测/生成","guard":"业务校准，禁止无依据自动承诺"},{"id":"M15","dept":"销售","title":"标书/RFP 条款提取、应答初稿与差距提示","ai":"检索/生成","guard":"技术、商务、法务审核"},{"id":"M16","dept":"销售","title":"报价单/合同关键字段核对","ai":"抽取/规则","guard":"最终价格/条款由授权人员批准"},{"id":"M17","dept":"销售","title":"CRM 录入草稿、拜访后任务提醒","ai":"生成/自动化","guard":"用户确认后写入，日志与撤销"},{"id":"M18","dept":"客服","title":"FAQ/产品知识自助问答","ai":"检索","guard":"可信知识库、引用、转人工机制"},{"id":"M19","dept":"客服","title":"工单分类、优先级判断与自动分派建议","ai":"分类","guard":"高风险/投诉/退款升级规则"},{"id":"M20","dept":"客服","title":"回复草稿生成与语气调整","ai":"生成","guard":"客服确认发送，避免杜撰政策"},{"id":"M21","dept":"客服","title":"多轮对话总结与客户问题历史摘要","ai":"总结","guard":"个人信息最小化、摘要准确性"},{"id":"M22","dept":"客服","title":"投诉、情绪、重复问题趋势识别","ai":"分类/分析","guard":"人工复核重大投诉与情绪判断"},{"id":"M23","dept":"客服","title":"退换货/补偿政策匹配建议","ai":"检索/规则","guard":"金额/账户动作需人工授权"},{"id":"M24","dept":"产品研发","title":"用户访谈、需求反馈主题归纳","ai":"总结/分类","guard":"原始样本代表性和隐私"},{"id":"M25","dept":"产品研发","title":"PRD/用户故事/验收标准初稿","ai":"生成","guard":"产品负责人定义范围与验收"},{"id":"M26","dept":"产品研发","title":"竞品功能与版本差异跟踪","ai":"检索/总结","guard":"来源与日期核验"},{"id":"M27","dept":"产品研发","title":"缺陷日志聚类、复现步骤与影响范围摘要","ai":"分类/生成","guard":"工程师验证根因和优先级"},{"id":"M28","dept":"产品研发","title":"代码补全、单元测试草案、代码解释","ai":"生成","guard":"代码审查、安全扫描、许可检查"},{"id":"M29","dept":"产品研发","title":"测试用例生成、测试结果汇总","ai":"生成/分类","guard":"QA 设计风险覆盖并复核"},{"id":"M30","dept":"产品研发","title":"产品文档、帮助中心和版本说明更新","ai":"生成","guard":"以已发布变更为准，编辑审核"},{"id":"M31","dept":"采购","title":"采购需求归类、请购单字段抽取","ai":"分类/抽取","guard":"预算与审批仍按授权流程"},{"id":"M32","dept":"采购","title":"供应商报价对比与偏差说明","ai":"抽取/分析","guard":"同口径比较；采购员核验条款"},{"id":"M33","dept":"采购","title":"供应商资质/合同/证照到期提醒","ai":"检索/自动化","guard":"资料来源、提醒责任人确认"},{"id":"M34","dept":"采购","title":"供应商风险信号和交期风险摘要","ai":"检索/预测","guard":"信息质量与供应商公平性"},{"id":"M35","dept":"采购","title":"采购合同条款、交付/付款条件抽取","ai":"抽取","guard":"法务和采购审批，不自动签约"},{"id":"M36","dept":"供应链","title":"需求预测、库存缺货/积压预警","ai":"预测","guard":"历史数据质量、人工调整"},{"id":"M37","dept":"供应链","title":"订单异常、延误原因与客户影响判断","ai":"分类/总结","guard":"运营确认原因后对外通知"},{"id":"M38","dept":"供应链","title":"仓库拣货/补货任务建议","ai":"优化/预测","guard":"库存系统一致性与人工例外"},{"id":"M39","dept":"供应链","title":"物流轨迹摘要、异常路线预警","ai":"预测/生成","guard":"定位/承运数据权限"},{"id":"M40","dept":"供应链","title":"供应计划与多方案情景比较","ai":"分析/预测","guard":"假设透明、计划员拍板"},{"id":"M41","dept":"生产/交付","title":"设备传感器异常检测与维护工单建议","ai":"预测","guard":"设备安全、误报处置、检修员确认"},{"id":"M42","dept":"生产/交付","title":"视觉质检缺陷识别/复核排序","ai":"视觉分类","guard":"误判校准、质量责任人抽检"},{"id":"M43","dept":"生产/交付","title":"生产日报、交接班记录生成","ai":"总结/生成","guard":"关键数字从系统读取并核验"},{"id":"M44","dept":"生产/交付","title":"工艺/作业指导书检索问答","ai":"检索","guard":"版本控制；安全操作必须人工确认"},{"id":"M45","dept":"生产/交付","title":"产能、排程与瓶颈分析建议","ai":"预测/优化","guard":"约束条件齐全，排程员确认"},{"id":"M46","dept":"财务","title":"发票/收据字段抽取、凭证草稿","ai":"OCR/抽取","guard":"会计复核，审计轨迹保留"},{"id":"M47","dept":"财务","title":"费用报销政策匹配与异常提示","ai":"检索/分类","guard":"不自动拒付；员工申诉路径"},{"id":"M48","dept":"财务","title":"应收账款逾期预测与催收优先级","ai":"预测","guard":"客户关系判断与催收策略由人决定"},{"id":"M49","dept":"财务","title":"现金流、收入、成本波动解释摘要","ai":"分析/生成","guard":"财务口径、预测情景注明"},{"id":"M50","dept":"财务","title":"月结差异、科目波动和异常交易筛查","ai":"异常检测","guard":"人工调查，避免自动认定舞弊"},{"id":"M51","dept":"人力资源","title":"JD 草拟、岗位要求结构化","ai":"生成","guard":"招聘经理审核，避免不当条件"},{"id":"M52","dept":"人力资源","title":"简历信息抽取与岗位匹配辅助","ai":"抽取/检索","guard":"人工决策、公平性、候选人告知"},{"id":"M53","dept":"人力资源","title":"面试问题生成与面试记录摘要","ai":"生成/总结","guard":"结构化评价；不自动淘汰候选人"},{"id":"M54","dept":"人力资源","title":"新员工入职问答与材料清单","ai":"检索/自动化","guard":"权限与员工资料保护"},{"id":"M55","dept":"人力资源","title":"培训内容个性化推荐与技能差距归纳","ai":"检索/分析","guard":"不将推断当正式绩效结论"},{"id":"M56","dept":"人力资源","title":"排班/休假规则问答与流程提醒","ai":"检索/自动化","guard":"劳动规则和地方制度核验"},{"id":"M57","dept":"法务/合规","title":"合同条款抽取、版本差异与风险点标注","ai":"抽取/比较","guard":"律师审核，不代替法律意见"},{"id":"M58","dept":"法务/合规","title":"内部制度/监管要求检索与出处摘要","ai":"检索","guard":"法规版本、司法辖区与来源核对"},{"id":"M59","dept":"法务/合规","title":"隐私/数据使用请求的初筛与分流","ai":"分类","guard":"DPO/法务最终决定与响应"},{"id":"M60","dept":"法务/合规","title":"合规证据材料清单生成与缺项追踪","ai":"生成/分类","guard":"控制负责人确认，证据原件留存"},{"id":"M61","dept":"IT/数据","title":"内部 IT 服务台工单分类和知识建议","ai":"分类/检索","guard":"高权限操作需身份验证与审批"},{"id":"M62","dept":"IT/数据","title":"代码/日志/告警摘要和故障排查步骤建议","ai":"总结/检索","guard":"工程师验证，禁止无审批改生产"},{"id":"M63","dept":"IT/数据","title":"数据字典、字段说明和数据查询辅助","ai":"检索/生成","guard":"行级权限、敏感字段屏蔽"},{"id":"M64","dept":"IT/数据","title":"访问权限申请材料检查与路由","ai":"分类/自动化","guard":"授权人批准；最小权限"},{"id":"M65","dept":"IT/数据","title":"AI 应用输出质量、成本、延迟与错误监测","ai":"监控/分析","guard":"设定阈值、人工响应和回退机制"},{"id":"M66","dept":"行政/办公","title":"邮件分类、重点事项摘要与回复草稿","ai":"分类/生成","guard":"对外发送前由员工确认"},{"id":"M67","dept":"行政/办公","title":"表单、报销、证明材料字段抽取与补件提醒","ai":"OCR/自动化","guard":"原件核对、异常人工处理"},{"id":"M68","dept":"行政/办公","title":"文件归档、标签、重复文件识别","ai":"分类/检索","guard":"归档规则、敏感文件权限"},{"id":"M69","dept":"行政/办公","title":"差旅政策问答与行程方案草拟","ai":"检索/生成","guard":"预算/预订/付款需授权"},{"id":"M70","dept":"行政/办公","title":"多语言翻译、会议口译初稿与术语一致性","ai":"生成","guard":"关键法律/技术文本人工审校"},{"id":"M71","dept":"电商/零售","title":"商品标题、属性、详情页与多语言文案草拟","ai":"生成/抽取","guard":"参数真实性、平台规则核验"},{"id":"M72","dept":"电商/零售","title":"商品评论主题、差评原因与退货理由归纳","ai":"分类/分析","guard":"代表性核查、隐私最小化"},{"id":"M73","dept":"电商/零售","title":"商品推荐、搭配建议与搜索问答","ai":"检索/推荐","guard":"个性化数据授权、推荐偏差"},{"id":"M74","dept":"电商/零售","title":"需求/价格/促销情景分析","ai":"预测/分析","guard":"价格策略由业务负责人决定"},{"id":"M75","dept":"电商/零售","title":"订单咨询、物流状态与售后分流","ai":"检索/分类","guard":"退款/改址等动作需验证授权"},{"id":"M76","dept":"客户成功/项目交付","title":"项目进度/风险/待决问题汇总","ai":"总结/预测","guard":"项目经理核验并负责对客沟通"},{"id":"M77","dept":"客户成功/项目交付","title":"客户健康度预警与续约机会提示","ai":"预测","guard":"不自动做客户价值/服务降级决定"},{"id":"M78","dept":"客户成功/项目交付","title":"实施方案、培训材料、交付文档初稿","ai":"生成","guard":"专家审核，绑定具体版本"},{"id":"M79","dept":"客户成功/项目交付","title":"工时记录、交付物和合同范围差异提示","ai":"抽取/比较","guard":"项目与财务负责人确认"},{"id":"M80","dept":"跨部门","title":"跨系统重复录入、字段映射和同步建议","ai":"抽取/自动化","guard":"先做数据映射、权限、审计及回滚"},{"id":"M81","dept":"跨部门","title":"内部知识搜索与答案引用","ai":"检索","guard":"单点登录、文档权限继承、来源链接"},{"id":"M82","dept":"跨部门","title":"文档摘要、版本差异和关键事项提取","ai":"总结/抽取","guard":"原文可追溯，重要结论人工确认"},{"id":"M83","dept":"跨部门","title":"低代码工作流中的 AI 分类/路由节点","ai":"分类/自动化","guard":"失败路径、审计日志、人工队列"},{"id":"M84","dept":"跨部门","title":"重复、规则明确的办公流程自动化机会发现","ai":"流程挖掘/分析","guard":"员工参与、例外处理、合规边界"},{"id":"M85","dept":"跨部门","title":"对外内容的事实核验、敏感信息与品牌检查","ai":"检索/分类","guard":"责任人批准，保留可解释提示"}];const depts=['全部部门',...new Set(items.map(x=>x.dept))];let dept='全部部门',i=0;const chosen=JSON.parse(localStorage.getItem('ai-scan')||'{}');function shown(){return items.filter(x=>dept==='全部部门'||x.dept===dept)}function render(){document.querySelector('#filters').innerHTML=depts.map(x=>`<button class="${x===dept?'active':''}" data-d="${x}">${x}</button>`).join('');document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dept=b.dataset.d;i=0;render()});let a=shown();if(i>=a.length)i=0;let x=a[i];document.querySelector('#count').textContent=`${i+1} / ${a.length} 项 · 共 ${items.length} 个任务`;let val=chosen[x.id]||{};document.querySelector('#card').innerHTML=`<span class="label">${x.dept} · ${x.id}</span><h2>${x.title}</h2><div class="muted">建议方式：${x.ai}</div><div class="grid"><div class="tile"><b>当前痛点（待访谈确认）</b>${x.title}可能依赖人工查找、整理、重复录入或逐条判断，需由企业补充实际频次与耗时。</div><div class="tile"><b>AI 可承担的工作</b>辅助完成${x.title}中的检索、生成、分类或信息抽取，形成供复核的草稿或建议。</div><div class="tile"><b>人机分工</b>AI 做初筛和草稿；员工核验事实、处理例外并做最终决定。${x.guard}</div><div class="tile"><b>预期收益</b>用处理时长、错误/返工率、响应时效或转化率建立基线后验证，不预设节省比例。</div><div class="tile"><b>落地难度 / 建议优先级</b>暂定中等；优先验证流程频次、数据可用性、系统接入与责任人。</div><div class="tile"><b>数据与风险要求</b>确认数据来源、权限、质量、更新责任；敏感数据仅进入批准的服务。按业务影响设置人工复核。</div></div><p><span class="label">当前选择：${val.status||'待筛选'}</span></p>`;document.querySelector('#note').value=val.note||''}function save(s){let x=shown()[i];chosen[x.id]={...(chosen[x.id]||{}),status:s,note:document.querySelector('#note').value};localStorage.setItem('ai-scan',JSON.stringify(chosen));i=Math.min(i+1,shown().length-1);render()}document.querySelector('#keep').onclick=()=>save('保留');document.querySelector('#skip').onclick=()=>save('暂不考虑');document.querySelector('#next').onclick=()=>{i=(i+1)%shown().length;render()};document.querySelector('#prev').onclick=()=>{i=(i-1+shown().length)%shown().length;render()};document.querySelector('#note').onchange=()=>{let x=shown()[i];chosen[x.id]={...(chosen[x.id]||{}),note:document.querySelector('#note').value};localStorage.setItem('ai-scan',JSON.stringify(chosen))};let sx=0,sy=0,card=document.querySelector('#card');card.style.touchAction='pan-y';card.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});card.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.25)save(dx>0?'保留':'暂不考虑')},{passive:true});render();</script></body></html>
