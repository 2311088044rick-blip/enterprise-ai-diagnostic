<style>
:root{--bg:#f5f5f2;--paper:#fff;--ink:#161a17;--muted:#69716b;--line:#e4e6e1;--green:#14684f;--mint:#e8f3ed;--lime:#d5f06a;--amber:#f3ead8;--shadow:0 16px 45px #17241b0b}
*{box-sizing:border-box}html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{width:min(100% - 40px,1100px);margin:auto}.nav{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:14px;font-weight:750;letter-spacing:.02em}.brand-mark{display:inline-grid;place-items:center;width:25px;height:25px;margin-right:8px;border-radius:8px;background:var(--lime);vertical-align:middle}.nav-right{font-size:12px;color:var(--muted)}.hero{padding:54px 0 26px;display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{color:var(--green);font-weight:750;font-size:11px;letter-spacing:.13em;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.03;letter-spacing:-.055em;margin:10px 0 13px}.hero p{color:var(--muted);font-size:16px;max-width:540px;margin:0}.hero-note{font-size:12px;color:var(--muted);background:#ebece7;border-radius:99px;padding:9px 13px;white-space:nowrap}.summary{display:flex;gap:10px;margin:18px 0}.counter{background:white;border:1px solid var(--line);border-radius:13px;padding:11px 15px;min-width:120px}.counter strong{font-size:22px;display:block;line-height:1.1}.counter span{font-size:11px;color:var(--muted)}.work{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}.side,.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.side{padding:16px;position:sticky;top:14px}.side h2{font-size:13px;margin:2px 0 10px}.departments{display:grid;gap:4px}.dept{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;color:#56615a;font-size:13px}.dept.active{background:var(--mint);color:var(--green);font-weight:700}.dept em{float:right;font-style:normal;color:#8b948e}.stage{min-width:0}.stage-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.progress{font-size:12px;color:var(--muted)}.search{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 11px;font-size:12px;width:min(230px,50%)}.card{overflow:hidden;touch-action:pan-y;transition:transform .2s,opacity .2s}.cover{height:clamp(210px,34vw,340px);position:relative;background:#e4e9e3}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#10201875)}.cover-tag{position:absolute;z-index:1;left:18px;top:18px;background:#ffffffdf;border-radius:99px;padding:7px 11px;font-size:11px;font-weight:700}.cover-caption{position:absolute;z-index:1;left:22px;bottom:18px;color:white;font-size:12px}.content{padding:22px 24px 20px}.headline-row{display:flex;justify-content:space-between;gap:12px;align-items:start}.headline-row h2{font-size:clamp(24px,3vw,34px);line-height:1.15;letter-spacing:-.04em;margin:7px 0 8px}.code{font-size:11px;color:#9aa19c}.intro{font-size:15px;color:#535d56;margin:0 0 16px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.chip{background:#f1f3ef;border-radius:99px;padding:6px 9px;font-size:11px;color:#526057}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{border-radius:14px;padding:14px;background:#f7f8f5}.detail.can{background:#edf6ef}.detail.cannot{background:#f5f2ec}.detail .icon{font-size:17px}.detail h3{font-size:13px;margin:5px 0}.detail p{font-size:13px;color:#59635c;margin:0}.divider{border:0;border-top:1px solid var(--line);margin:17px 0 12px}.value-line{font-size:12px;color:var(--muted)}.value-line b{color:var(--ink)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}.action{min-height:52px;border:1px solid var(--line);border-radius:14px;background:white;font-weight:700;font-size:14px}.action.skip{color:#606a63}.action.keep{background:var(--green);border-color:var(--green);color:white}.keyboard{font-size:10px;color:#9aa19c;text-align:center;margin:7px 0 18px}.toolbar{display:flex;gap:8px;justify-content:flex-end}.smallbtn{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 11px;font-size:11px;color:#4b5850}.note{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;font-size:13px;resize:vertical;min-height:54px;margin-top:12px}.report{margin:32px 0 16px;padding:24px}.report-head{display:flex;justify-content:space-between;align-items:end;gap:15px}.report h2{font-size:27px;letter-spacing:-.04em;margin:5px 0}.report-head p{margin:0;color:var(--muted);font-size:13px}.report-actions{display:flex;gap:7px}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:19px 0}.report-kpi{border:1px solid var(--line);border-radius:14px;padding:15px}.report-kpi b{font-size:24px;display:block}.report-kpi span{font-size:11px;color:var(--muted)}.section-title{font-size:15px;margin:23px 0 10px}.insight-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.insight{border-radius:14px;background:#f7f8f5;padding:15px}.insight .num{color:var(--green);font-weight:800;font-size:11px}.insight h3{font-size:14px;margin:5px 0}.insight p{font-size:12px;color:#5c665f;margin:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;font-size:12px;min-width:650px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f6f7f4;color:#667169;font-size:11px}tr:last-child td{border-bottom:0}.case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.case{background:#17251f;color:white;border-radius:15px;padding:16px}.case .source{font-size:10px;color:#b8c8be}.case strong{display:block;font-size:23px;line-height:1.1;margin:9px 0}.case p{font-size:12px;color:#e0e8e2;margin:0}.case a{font-size:11px;color:#d5f06a;display:inline-block;margin-top:12px}.fineprint{font-size:10px;color:#8a928c;margin-top:11px}.empty{text-align:center;padding:55px 20px}.hidden{display:none!important}.footer{text-align:center;color:#919992;font-size:10px;padding:15px 0 35px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#17251f;color:white;padding:10px 14px;border-radius:99px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}.toast.show{opacity:1}
@media(max-width:760px){.shell{width:100%;padding:0 15px}.nav{height:54px}.nav-right{font-size:10px}.hero{display:block;padding:28px 0 13px}.hero h1{font-size:36px;margin:8px 0}.hero p{font-size:14px;line-height:1.45}.hero-note{display:inline-block;margin-top:12px}.summary{gap:7px;margin:12px 0}.counter{min-width:0;flex:1;padding:9px 11px}.counter strong{font-size:20px}.counter span{font-size:10px}.work{display:flex;flex-direction:column;gap:9px}.side{position:static;width:100%;padding:11px 12px;border-radius:14px}.side h2{font-size:11px;margin:0 0 7px}.departments{display:flex;overflow-x:auto;gap:5px;scrollbar-width:none}.departments::-webkit-scrollbar{display:none}.dept{flex:0 0 auto;padding:8px 10px;font-size:11px;background:#f6f7f4}.dept em{margin-left:5px}.stage{width:100%}.stage-top{margin:2px 1px 7px}.progress{font-size:11px}.search{font-size:11px;padding:7px 9px}.panel,.side{border-radius:15px}.cover{height:clamp(190px,56vw,255px)}.cover-tag{left:12px;top:12px;font-size:10px;padding:6px 9px}.cover-caption{left:14px;bottom:12px;font-size:11px}.content{padding:16px 15px 13px}.headline-row h2{font-size:25px}.intro{font-size:14px;margin:0 0 12px}.chips{gap:5px;margin-bottom:11px}.chip{font-size:10px;padding:5px 8px}.details{grid-template-columns:1fr 1fr;gap:7px}.detail{padding:11px;border-radius:12px}.detail h3{font-size:12px}.detail p{font-size:11px;line-height:1.45}.divider{margin:12px 0 9px}.value-line{font-size:11px}.actions{position:sticky;bottom:0;z-index:5;margin:8px -15px 0;padding:9px 15px calc(9px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);gap:8px}.action{min-height:48px;font-size:13px;border-radius:12px}.keyboard{display:none}.toolbar{justify-content:center}.smallbtn{font-size:10px}.note{margin-top:10px;font-size:12px;min-height:45px}.report{margin:22px 0 12px;padding:17px}.report-head{display:block}.report h2{font-size:23px}.report-head p{font-size:12px}.report-actions{margin-top:12px}.report-actions button{flex:1}.report-grid{gap:7px;margin:14px 0}.report-kpi{padding:11px 9px}.report-kpi b{font-size:20px}.report-kpi span{font-size:9px}.insight-grid{grid-template-columns:1fr;gap:8px}.insight{padding:12px}.case-grid{grid-template-columns:1fr}.case{padding:14px}.section-title{font-size:14px;margin:18px 0 8px}.fineprint{line-height:1.5}.footer{padding-bottom:calc(24px + env(safe-area-inset-bottom))}}
@media(max-width:370px){.shell{padding:0 11px}.content{padding:14px 12px 10px}.headline-row h2{font-size:22px}.details{grid-template-columns:1fr}.actions{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}.case strong{font-size:21px}}
@media print{body{background:white}.nav,.hero,.summary,.side,.stage-top,.actions,.keyboard,.toolbar,.note,.toast{display:none!important}.shell{width:100%;padding:0}.work{display:block}.report{box-shadow:none;border:0;padding:0}.case{print-color-adjust:exact;-webkit-print-color-adjust:exact}.report-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="shell">
<header class="nav"><div class="brand"><span class="brand-mark">✳</span>AI 机会诊断</div><div class="nav-right">轻松选场景 · 生成企业诊断</div></header>
<section class="hero"><div><div class="eyebrow">从真实工作开始</div><h1>AI 能帮上哪些忙？</h1><p>看一个工作场景，判断它值不值得先试。右滑保留，左滑跳过；也可以直接点按钮。</p></div><span class="hero-note">完整清单 · 85 个场景</span></section>
<div class="summary"><div class="counter"><strong id="n-keep">0</strong><span>已保留</span></div><div class="counter"><strong id="n-skip">0</strong><span>已跳过</span></div><div class="counter"><strong id="n-left">85</strong><span>还没看</span></div></div>
<div class="work">
<aside class="side"><h2>先看哪个工作</h2><div class="departments" id="departments"></div></aside>
<main class="stage"><div class="stage-top"><div class="progress" id="progress"></div><input class="search" id="search" placeholder="搜一个场景"></div><article class="panel card" id="card"></article><div class="actions"><button class="action skip" id="skip">← 跳过</button><button class="action keep" id="keep">保留 →</button></div><div class="keyboard">桌面上可按 ← / → · 手机左右滑动卡片</div><div class="toolbar"><button class="smallbtn" id="undo">撤销上一步</button><button class="smallbtn" id="clear">重新开始</button></div><textarea id="note" class="note" placeholder="可选：写下你公司的实际情况"></textarea></main>
</div>
<section class="panel report" id="report">
<div class="report-head"><div><div class="eyebrow">你的诊断摘要</div><h2>把机会变成行动</h2><p>先看保留项，再决定从哪里试点。</p></div><div class="report-actions"><button class="smallbtn" id="csv">导出表格 CSV</button><button class="smallbtn" onclick="window.print()">打印 / 保存 PDF</button></div></div>
<div id="report-body"></div>
</section>
<footer class="footer">选择结果保存在本机浏览器。外部案例仅作参考，实际收益需用企业自己的数据验证。</footer>
</div><div class="toast" id="toast"></div>
<script>
const tasks=[
{id:"M01",dept:"经营管理",title:"周报总要一份份看？",scene:"把分散的周报，变成一眼能看懂的进展和问题。",photo:"assets/management-weekly.png",alt:"管理者与团队查看经营周报",ai:"AI 可以汇总各部门周报，提取进度、风险和待决问题，先生成一份简明摘要。",limits:"AI 不知道哪些问题最重要，也不能替管理者定优先级、拍板或确认责任人。",measure:"周报汇总耗时、问题发现到处理的时间、遗漏的关键事项数。",cause:"常见原因：汇报格式不统一、信息分散在多人多份文档里，管理者只能靠人工拼全貌。",first:"先统一周报字段和数据来源；选一个部门试跑，让负责人逐条核对摘要。",benefit:"做到能稳定发现进度偏差和待决问题后，管理者可更早介入，把时间转回到决策和辅导团队。",risk:"部门数据权限、口径一致性、未公开经营信息。",difficulty:"低—中",priority:"建议先试"},
{id:"S13",dept:"销售",title:"见客户前还在翻资料？",scene:"客户会面前，把历史沟通和客户信息整理成一页准备卡。",photo:"assets/sales-prep.png",alt:"销售人员在拜访前准备客户资料",ai:"AI 可以从获准的 CRM 和公开资料中整理客户背景、历史沟通、待确认需求，并草拟会前提纲。",limits:"AI 不能保证资料最新，不能替销售判断客户真实意图，也不能擅自承诺价格、交期或合同条件。",measure:"会前准备耗时、CRM 信息完整率、会后跟进及时率、商机推进周期。",cause:"常见原因：客户信息分散在 CRM、邮件和个人笔记中，交接时上下文容易断掉。",first:"先接入经过授权的客户资料；要求每条关键结论带来源；销售确认后再用于拜访。",benefit:"做到会前准备更快、交接更完整后，销售可把精力放在客户沟通和方案质量上。",risk:"客户隐私、资料时效、未经核实的销售承诺。",difficulty:"低—中",priority:"建议先试"},
{id:"C18",dept:"客服",title:"客服每天都在重复回答？",scene:"先让 AI 找到标准答案、起草回复，复杂问题交给客服。",photo:"assets/customer-support.png",alt:"客服人员佩戴耳机处理客户问题",ai:"AI 可以依据已批准的产品知识和服务政策，检索答案、生成回复草稿，并总结客户问题。",limits:"AI 不应编造政策、承诺退款或自行处理投诉；遇到不确定、敏感或高风险情况必须转人工。",measure:"首次响应时间、平均处理时长、一次解决率、转人工率、抽检错误率。",cause:"常见原因：知识库散乱或过期、问题高度重复、一线需要频繁找专家确认。",first:"先整理高频 FAQ 和有效政策，限定答案来源；先草拟不自动发送，每天抽查答案。",benefit:"做到高频问题答得快且准确后，客服可以把更多时间留给复杂投诉和需要关怀的客户。",risk:"客户个人信息、过期知识、错误承诺与升级机制。",difficulty:"低—中",priority:"建议先试"},
{id:"P41",dept:"生产交付",title:"设备出问题才开始排查？",scene:"从设备数据里早点发现异常，把维修线索交给现场人员确认。",photo:"assets/factory-inspection.png",alt:"技术人员在工厂现场巡检设备",ai:"AI 可以分析已接入的传感器和维修记录，提示异常趋势、可能原因和建议检查项。",limits:"AI 不能保证故障预测准确，不能替代安全规程或授权人员操作设备，更不能未经验证直接控制生产线。",measure:"非计划停机时长、误报/漏报、维修响应时间、维护成本。",cause:"常见原因：设备数据没打通、故障记录不完整、维护长期依赖个人经验。",first:"选一台关键设备做只读试点；对照历史故障验证提示，再由工程师确认后开维修单。",benefit:"做到异常发现更早、维修判断更有依据后，企业可减少意外停机并改善排产稳定性。",risk:"生产安全、传感器质量、误报漏报、设备接口权限。",difficulty:"中—高",priority:"先补数据"}
];
const references=[
{company:"餐饮小企业 · 美国",metric:"95%",label:"定价分析时间减少",detail:"从 5 天缩短到 1–2 小时；月度现金对账从 3 小时缩到 5–10 分钟。",url:"https://openai.com/index/ted-taylor-restaurant/",source:"OpenAI 客户案例"},
{company:"Acentra Health · 医疗服务",metric:"约 50%",label:"申诉信处理时间减少",detail:"公司称累计节省 11,000 护理工时、近 80 万美元；AI 先起草，护士复核。",url:"https://www.microsoft.com/en/customers/story/19280-acentra-health-azure",source:"Microsoft 客户案例"},
{company:"Eaton · 供应链",metric:"25%",label:"供应链团队生产力提升",detail:"Palantir 公布的案例材料称，AI 工作流帮助识别、排序和处理供应短缺。",url:"https://www.palantir.com/assets/xrfr7uokpv1b/5fyrfyRAFBtNSIBSWGc9xI/0741a1e422a8cacf1676dde769fb7102/One-Pager_-_Supply_Chain_Risk_Resilience.pdf",source:"Palantir 案例材料"}
];
const saved=JSON.parse(localStorage.getItem("ai-scan-v2")||"{}");let activeDept="全部",cursor=0,history=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const status=id=>saved[id]?.status||"待选择";
function eligible(){const q=document.getElementById("search").value.trim().toLowerCase();return tasks.filter(t=>(activeDept==="全部"||t.dept===activeDept)&&(!q||(t.title+t.scene+t.dept).toLowerCase().includes(q))&&status(t.id)==="待选择")}
function persist(){localStorage.setItem("ai-scan-v2",JSON.stringify(saved));render()}
function toast(s){const e=document.getElementById("toast");e.textContent=s;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1100)}
function choose(value){const list=eligible();if(!list.length)return;const task=list[Math.min(cursor,list.length-1)];history.push({id:task.id,old:saved[task.id]?{...saved[task.id]}:null});saved[task.id]={status:value,note:document.getElementById("note").value};persist();toast(value==="保留"?"已保留":"已跳过")}
function renderDepartments(){const ds=["全部",...new Set(tasks.map(t=>t.dept))];const counts={};tasks.forEach(t=>counts[t.dept]=(counts[t.dept]||0)+1);document.getElementById("departments").innerHTML=ds.map(d=>'<button class="dept '+(d===activeDept?"active":"")+'" data-dept="'+esc(d)+'">'+esc(d)+' <em>'+(d==="全部"?tasks.filter(t=>status(t.id)==="待选择").length:tasks.filter(t=>t.dept===d&&status(t.id)==="待选择").length)+'</em></button>').join("");document.querySelectorAll(".dept").forEach(b=>b.onclick=()=>{activeDept=b.dataset.dept;cursor=0;render()})}
function renderCard(){const list=eligible();const card=document.getElementById("card");if(!list.length){card.innerHTML='<div class="empty"><div style="font-size:28px">✓</div><h2>这一轮看完了</h2><p class="value-line">你的诊断摘要已在下方更新。可以撤销选择或重新开始。</p></div>';document.getElementById("progress").textContent="已完成";return}if(cursor>=list.length)cursor=0;const t=list[cursor];document.getElementById("progress").textContent=(tasks.length-tasks.filter(x=>status(x.id)==="待选择").length+cursor+1)+" / "+tasks.length+" · "+list.length+" 项待看";const note=saved[t.id]?.note||"";card.innerHTML='<div class="cover"><img src="'+esc(t.photo)+'" alt="'+esc(t.alt)+'"><span class="cover-tag">'+esc(t.dept)+'</span><span class="cover-caption">'+esc(t.scene)+'</span></div><div class="content"><div class="headline-row"><div><div class="eyebrow">'+esc(t.dept)+' · 工作场景</div><h2>'+esc(t.title)+'</h2></div><span class="code">'+esc(t.id)+'</span></div><p class="intro">'+esc(t.scene)+'</p><div class="chips"><span class="chip">难度 '+esc(t.difficulty)+'</span><span class="chip">'+esc(t.priority)+'</span></div><div class="details"><section class="detail can"><div class="icon">✳</div><h3>AI 能帮到哪</h3><p>'+esc(t.ai)+'</p></section><section class="detail cannot"><div class="icon">◌</div><h3>AI 做不到什么</h3><p>'+esc(t.limits)+'</p></section></div><hr class="divider"><div class="value-line"><b>试点先看：</b>'+esc(t.measure)+'</div><textarea class="note" id="cardnote" placeholder="可选：记下你公司的情况">'+esc(note)+'</textarea></div>';document.getElementById("cardnote").onchange=e=>{saved[t.id]={...(saved[t.id]||{}),note:e.target.value};localStorage.setItem("ai-scan-v2",JSON.stringify(saved))}}
function renderReport(){const kept=tasks.filter(t=>status(t.id)==="保留"),skipped=tasks.filter(t=>status(t.id)==="跳过"),pending=tasks.length-kept.length-skipped.length;document.getElementById("n-keep").textContent=kept.length;document.getElementById("n-skip").textContent=skipped.length;document.getElementById("n-left").textContent=pending;const byDept={};kept.forEach(t=>byDept[t.dept]=(byDept[t.dept]||0)+1);const top=[...kept].sort((a,b)=>(a.priority==="建议先试"?-1:0)-(b.priority==="建议先试"?-1:0));let html='<div class="report-grid"><div class="report-kpi"><b>'+kept.length+' 项</b><span>你认为值得继续看的机会</span></div><div class="report-kpi"><b>'+Object.keys(byDept).length+' 个</b><span>覆盖工作领域</span></div><div class="report-kpi"><b>'+pending+' 项</b><span>尚未筛选</span></div></div>';
if(kept.length){html+='<h3 class="section-title">建议从这几项开始</h3><div class="table-wrap"><table><thead><tr><th>工作场景</th><th>建议先补</th><th>做到哪一步</th><th>看什么好处</th><th>验证指标</th></tr></thead><tbody>'+top.map(t=>'<tr><td><b>'+esc(t.title)+'</b><br>'+esc(t.dept)+'</td><td>'+esc(t.first)+'</td><td>先让 AI 给建议，由员工复核；结果稳定后再考虑接入流程。</td><td>'+esc(t.benefit)+'</td><td>'+esc(t.measure)+'</td></tr>').join("")+'</tbody></table></div>';
html+='<h3 class="section-title">为什么这些地方可能卡住</h3><div class="insight-grid">'+top.map((t,i)=>'<article class="insight"><span class="num">可能原因 '+String(i+1).padStart(2,"0")+'</span><h3>'+esc(t.title)+'</h3><p>'+esc(t.cause)+'<br><br><b>部署前先确认：</b>'+esc(t.risk)+'；难度初判 '+esc(t.difficulty)+'。</p></article>').join("")+'</div><h3 class="section-title">从试点到部署，建议走三步</h3><div class="insight-grid"><article class="insight"><span class="num">01 · 先摸清</span><h3>记下现在怎么做</h3><p>抽样记录处理时间、错误/返工、每周频次和涉及人员，定一个真实基线。</p></article><article class="insight"><span class="num">02 · 小范围验证</span><h3>AI 先做草稿和提醒</h3><p>限定数据和权限，员工复核；试点 2–4 周，逐周看质量和省下的时间。</p></article><article class="insight"><span class="num">03 · 算清再扩</span><h3>看净收益再决定</h3><p>把工具、集成、数据整理、培训、人工复核和持续维护都算进成本，再扩展到更多流程。</p></article><article class="insight"><span class="num">投入回报测算</span><h3>先填企业自己的数字</h3><p>可回收工时 × 人工综合成本 + 可核验的增收/损耗避免 − 全部部署与运行成本。没有基线时先测量，不填虚构的 ROI。</p></article></div>';
}else{html+='<div class="insight"><h3>先筛选几个真实工作场景</h3><p>完成选择后，我会按你的保留项生成改进顺序、原因判断和试点指标。</p></div>'}
html+='<h3 class="section-title">市场公开案例：证明路径可行，不是你的收益承诺</h3><div class="case-grid">'+references.map(r=>'<article class="case"><span class="source">'+esc(r.company)+' · '+esc(r.source)+'</span><strong>'+esc(r.metric)+'</strong><b style="font-size:12px">'+esc(r.label)+'</b><p style="margin-top:8px">'+esc(r.detail)+'</p><a href="'+esc(r.url)+'" target="_blank" rel="noreferrer">查看原始案例 ↗</a></article>').join("")+'</div><p class="fineprint">这些数字来自供应商公开客户案例，规模、基线、时间范围和统计方法不同，可能未经独立审计。此处不推导收入增长；未披露的营收数据不作猜测。客户项目须单独建立基线并验证因果关系。';
document.getElementById("report-body").innerHTML=html+'</p>'}
function render(){renderDepartments();renderCard();renderReport()}
document.getElementById("keep").onclick=()=>choose("保留");document.getElementById("skip").onclick=()=>choose("跳过");document.getElementById("search").oninput=()=>{cursor=0;render()};document.getElementById("undo").onclick=()=>{const h=history.pop();if(!h){toast("没有可撤销的选择");return}if(h.old)saved[h.id]=h.old;else delete saved[h.id];localStorage.setItem("ai-scan-v2",JSON.stringify(saved));cursor=0;render();toast("已撤销")};document.getElementById("clear").onclick=()=>{if(!confirm("清除本轮选择并重新开始？"))return;Object.keys(saved).forEach(k=>delete saved[k]);history=[];cursor=0;localStorage.removeItem("ai-scan-v2");render()};document.getElementById("csv").onclick=()=>{const kept=tasks.filter(t=>status(t.id)==="保留");const cols=["部门","工作场景","AI能帮到哪","AI做不到什么","可能原因","建议先补","预期改善","验证指标","难度","风险"];const rows=kept.map(t=>[t.dept,t.title,t.ai,t.limits,t.cause,t.first,t.benefit,t.measure,t.difficulty,t.risk]);const q=x=>'"'+String(x??"").replaceAll('"','""')+'"';const csv="\uFEFF"+[cols,...rows].map(r=>r.map(q).join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="企业AI机会诊断.csv";a.click();URL.revokeObjectURL(a.href)};
document.addEventListener("keydown",e=>{if(e.target.matches("textarea,input"))return;if(e.key==="ArrowRight")choose("保留");if(e.key==="ArrowLeft")choose("跳过")});
const card=document.getElementById("card");let sx=0,sy=0;card.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});card.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.2){card.style.transform="translateX("+(dx>0?"28px":"-28px")+")";card.style.opacity=".7";setTimeout(()=>{card.style.transform="";card.style.opacity="";choose(dx>0?"保留":"跳过")},130)}},{passive:true});render();
</script></body></html>
