function renderReport(){const kept=tasks.filter(t=>status(t.id)==="保留"),skipped=tasks.filter(t=>status(t.id)==="跳过"),pending=tasks.length-kept.length-skipped.length;document.getElementById("n-keep").textContent=kept.length;document.getElementById("n-skip").textContent=skipped.length;document.getElementById("n-left").textContent=pending;const byDept={};kept.forEach(t=>byDept[t.dept]=(byDept[t.dept]||0)+1);const top=[...kept].sort((a,b)=>(a.priority==="建议先试"?-1:0)-(b.priority==="建议先试"?-1:0));let html='<div class="report-grid"><div class="report-kpi"><b>'+kept.length+' 项</b><span>你认为值得继续看的机会</span></div><div class="report-kpi"><b>'+Object.keys(byDept).length+' 个</b><span>覆盖工作领域</span></div><div class="report-kpi"><b>'+pending+' 项</b><span>尚未筛选</span></div></div>';

document.getElementById("keep").onclick=()=>choose("保留");document.getElementById("skip").onclick=()=>choose("跳过");document.getElementById("search").oninput=()=>{cursor=0;render()};document.getElementById("undo").onclick=()=>{const h=history.pop();if(!h){toast("没有可撤销的选择");return}if(h.old)saved[h.id]=h.old;else delete saved[h.id];localStorage.setItem("ai-scan-v2",JSON.stringify(saved));cursor=0;render();toast("已撤销")};document.getElementById("clear").onclick=()=>{if(!confirm("清除本轮选择并重新开始？"))return;Object.keys(saved).forEach(k=>delete saved[k]);history=[];cursor=0;localStorage.removeItem("ai-scan-v2");render()};document.getElementById("csv").onclick=()=>{const kept=tasks.filter(t=>status(t.id)==="保留");const cols=["部门","工作场景","AI能帮到哪","AI做不到什么","可能原因","建议先补","预期改善","验证指标","难度","风险"];const rows=kept.map(t=>[t.dept,t.title,t.ai,t.limits,t.cause,t.first,t.benefit,t.measure,t.difficulty,t.risk]);const q=x=>'"'+String(x??"").replaceAll('"','""')+'"';const csv="\uFEFF"+[cols,...rows].map(r=>r.map(q).join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="企业AI机会诊断.csv";a.click();URL.revokeObjectURL(a.href)};
document.addEventListener("keydown",e=>{if(e.target.matches("textarea,input"))return;if(e.key==="ArrowRight")choose("保留");if(e.key==="ArrowLeft")choose("跳过")});
const card=document.getElementById("card");let sx=0,sy=0;card.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});card.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.2){card.style.transform="translateX("+(dx>0?"28px":"-28px")+")";card.style.opacity=".7";setTimeout(()=>{card.style.transform="";card.style.opacity="";choose(dx>0?"保留":"跳过")},130)}},{passive:true});render();
